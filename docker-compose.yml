services:
  db:
    image: postgres:16
    container_name: azesa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: azesa
      POSTGRES_PASSWORD: azesa
      POSTGRES_DB: azesa
    ports:
      - "5432:5432"
    volumes:
      - azesa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azesa -d azesa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  azesa_pgdata:
